  help: "<light_purple>教程"
  help-description: "了解此菜单及其背后的 Towny 功能如何运作。"
  join-hint: "<yellow>初来乍到？<click:run_command:'/townymenu tutorial'><hover:show_text:'<gray>/townymenu tutorial'><green><u>打开教程</u></green></hover></click><yellow>，了解城镇、地块和国家的玩法。"

  # 来自本服务器 Towny 设置的实时数值，显示在课程下方。
  fact:
    shortcut: "<gray>潜行 + 副手切换快捷键: {value}"
    world-no-towny: "<gray>此世界未启用 Towny。"
