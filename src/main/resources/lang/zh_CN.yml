    max-bail: "<gray>最高保释金：<white>{cost}"

  start:
    title: "<aqua>入门"
    description: "Towny 是什么、如何打开和看懂这些菜单、荒野、地图、邀请以及排行榜。"
    towny: "Towny 是什么？"
    towny-body: "Towny 让玩家通过建立城镇来保护土地。城镇占领的区块不会被外人破坏，城镇可以收税，还能与其他城镇组成国家。无人占领的土地就是荒野。"
    menus: "打开菜单"
    menus-body: "输入 /tm，或潜行时按副手切换键（F）即可打开主菜单。点击聊天中的 TownyMenu 前缀也能打开。每个按钮都会替你执行对应的 Towny 命令，费用和规则与 Towny 本身一致。"
    buttons: "看懂按钮"
    buttons-body: "将鼠标悬停在按钮上即可查看其作用。灰色染料表示你没有执行该操作的权限。开关开启时会发光。名称和数额在对话框中输入，无法撤销的操作会先请你确认。"
    wilderness: "荒野"
    wilderness-body: "未被占领的土地不属于任何人。视世界设置而定，你也许可以在那里建造，但建筑不受任何保护。加入城镇才能保护你的成果。"
    map: "地图"
    map-body: "地图显示你周围的区块，并按归属着色：你的城镇、你的地块、你的国家、盟友、敌人以及其他城镇。发光的格子正在出售。点击已占领的格子可查看所属城镇，右键出售中的格子即可购买。"
    invites: "邀请"
    invites-body: "城镇邀请玩家，国家邀请城镇，国家之间还会发送结盟请求。所有待处理的邀请都在邀请菜单中，你可以在那里接受或拒绝。收到邀请时 TownyMenu 还会在聊天中提醒你，点击消息即可打开该菜单。"
    leaderboards: "排行榜"
    leaderboards-body: "排行榜菜单按居民数、领地和银行余额为城镇与国家排名，也按拥有的地块数为玩家排名。点击任意条目即可打开。"

  join:
    title: "<gold>寻找城镇"
    description: "城镇的意义、加入城镇、建立自己的城镇以及离开城镇。"
    why: "为什么要加入城镇？"
    why-body: "城镇居民共享受保护的土地，可以拥有地块、传送到城镇出生点，并参与所在城镇的国家。荒野中的建筑没有这些保护。"
    browse: "加入城镇"
    browse-body: "浏览城镇目录，可按居民数、领地、是否开放或与你的距离排序。开放的城镇一键即可加入，其他城镇需要镇长或助理邀请你。"
    invites: "接受邀请"
    invites-body: "城镇邀请你后，在邀请菜单中接受即可。你同一时间只能属于一个城镇。如果不想收到邀请，可以在个人设置中开启忽略邀请。"
    found: "建立城镇"
    found-body: "站在你想建立城镇的地方，选择建立城镇。你所在的区块会成为城镇的主区块和出生点，你将成为镇长。新城镇必须与其他城镇保持足够距离。"
    leave: "离开城镇"
    leave-body: "居民可以在城镇菜单中离开城镇。镇长不能直接离开：需要先把城镇交给其他居民，或者删除城镇。离开时，你拥有的地块会归还城镇。"

  town:
    title: "<gold>经营城镇"
    description: "等级、职位、招募、出生点、设置、详情、公告、合并、出售以及废墟。"
    ranks: "镇长与职位"
    ranks-body: "镇长拥有全部权力。助理、警长、建筑师等职位分担其中一部分，每个职位的具体权限由服务器决定。在居民菜单中打开居民资料即可授予职位。"
    grow: "壮大城镇"
    grow-body: "在居民菜单中邀请玩家，或将城镇设为开放，让任何人都能加入。居民越多，城镇通常能占领的土地也越多。"
    spawn: "出生点与主区块"
    spawn-body: "主区块是城镇的核心，城镇出生点就在其中。居民可以从城镇菜单传送到出生点；城镇公开时访客也可以。镇长可以在城镇详情中移动出生点和主区块。"
    settings: "城镇设置"
    settings-body: "PvP、敌对生物、火焰蔓延和爆炸对整个城镇统一开关。开放让任何人无需邀请即可加入，公开让访客可以使用你的出生点，和平则让城镇远离 PvP 与战争。国家中的城镇还可以关闭保护其周边土地的国家区域。"
    details: "名称、公告与标签"
    details-body: "在城镇详情中，镇长可以重命名城镇、编写居民登录时看到的公告、设置简短的聊天标签，并选择城镇的地图颜色。"
    sell: "出售城镇"
    sell-body: "镇长可以在城镇详情中出售城镇。购买者支付价格后成为新镇长。出售中的城镇会在城镇目录中标出。"
    ruins: "废墟与删除"
    ruins-body: "删除城镇会把它的全部土地归还荒野。启用废墟时，被删除或破产的城镇会先变成废墟，随时间逐渐对所有人开放。在废墟消失前，其居民可以在城镇菜单中收复它；在部分服务器上，无城镇的玩家也可以站在废墟中，通过“寻找城镇”菜单收复。"
    announce: "公告"
    announce-body: "在居民菜单中使用“向城镇公告”，向所有在线居民发送消息。国家领袖也可以在国家菜单中向整个国家发布公告。"
    merge: "合并城镇"
    merge-body: "镇长可以在城镇目录中打开另一个城镇的页面，请求它并入自己的城镇。对方镇长必须在线并接受，之后对方的居民、土地和银行都会并入你的城镇。"
    status: "城镇等级与警告"
    status-body: "在城镇菜单中点击顶部的城镇图标，即可查看等级、升级所需的居民或领地数量、土地与前哨上限，以及下一个新的一天需要支付的维护费。负债、领地超额、被征服等需要注意的情况会显示在这里和城镇图标上。"

  claims:
    title: "<green>占领土地"
    description: "区块与领地上限、占领与放弃、前哨、额外领地以及割让与夺取土地。"
    chunks: "领地以区块为单位"
    chunks-body: "城镇以区块为单位占领土地，每个区块称为一块领地。每块已占领的区块都受城镇权限保护。可占领的数量取决于居民人数和额外领地。"
    claim: "占领土地"
    claim-body: "站在城镇旁边，可以占领你所在的区块、你周围的一片正方形区域，或被城镇包围的空隙。新领地必须与城镇已有的土地相邻。"
    auto: "自动占领"
    auto-body: "开启自动占领后四处走动：只要城镇负担得起且还有领地名额，你走进的每个区块都会被占领。完成后记得关闭。"
    unclaim: "放弃土地"
    unclaim-body: "放弃不再需要的区块可以腾出领地名额。主区块不能被放弃。有些服务器会慢慢把被放弃的土地恢复原貌。"
    outposts: "前哨"
    outposts-body: "前哨是远离城镇的领地，例如远处的矿场或农场。每个前哨都有居民可以传送过去的出生点，还可以在其周围继续占领土地。镇长也可以在地块菜单中把现有领地设为前哨，或移动前哨的出生点。"
    bonus: "额外领地"
    bonus-body: "领地达到上限了？用城镇银行的钱购买额外领地。每次购买后价格可能上涨。"
    cede: "割让土地"
    cede-body: "站在城镇的某个区块中，选择“割让此地块”即可把它交给另一个城镇，例如用于调整边界。对方镇长必须在线并接受。主区块无法割让。"
    takeover: "夺取领地"
    takeover-body: "领地超过上限的城镇处于超额状态。你的城镇可以用“夺取领地”占领超额城镇边缘、与你的领地相邻的区块。视服务器设置而定，双方国家可能需要互为敌对。"

  plots:
    title: "<yellow>地块"
    description: "拥有、购买与出售地块，批量地块操作，地块类型、设置、信任、入镇天数限制以及地块组。"
    what: "什么是地块？"
    what-body: "城镇占领的每个区块都是一个地块。在居民购买之前，地块归城镇所有；购买后由地块主决定谁可以在上面建造。站在地块中打开地块菜单即可查看其主人，点击地块图标可查看 Towny 的完整地块信息，或开启地块信息面板在行走时查看。"
    buy: "购买地块"
    buy-body: "出售中的地块在地图上会发光，在地图上右键即可远程购买。也可以走进地块，打开地块菜单并选择购买地块，支付价格后即可成为地块主。"
    sell: "出售与放弃"
    sell-body: "地块主和镇长可以出售地块，价格设为 0 即免费赠送。放弃地块会把它归还城镇。镇长可以驱逐地块主，右键“驱逐所有者”还会立即重新出售该地块。"
    types: "地块类型"
    types-body: "镇长可以设置每个地块的类型。商店和大使馆有各自的价格与税率，大使馆还能被其他城镇的玩家购买。竞技场始终允许 PvP，旅馆允许任何人睡觉，农场允许居民耕种，野外允许居民砍树和挖矿，监狱则用来关押犯人。"
    settings: "地块设置"
    settings-body: "地块主可以开关自己地块上的 PvP、火焰、爆炸和生物，镇长可以决定地块是否收税。世界本身的规则始终优先。"
    trust: "地块信任"
    trust-body: "在单个地块上信任某位玩家，即可让其在此建造，而不必为所有人修改地块权限。"
    groups: "地块组与街区"
    groups-body: "地块组把多个地块捆绑在一起，统一出售和管理，就像一座大房子。地块属于某个组时，它的出售、类型、设置、权限、信任和入镇天数限制都会作用于整个组。街区则为一片更大的地块区域命名，例如商业区。"
    join-days: "入镇天数限制"
    join-days-body: "镇长可以把地块留给新居民或老居民：设置购买者至少或最多需要在城镇居住的天数，也可以两者都设。"
    area: "批量地块操作"
    area-body: "在地块菜单中选择你周围的方形或圆形区域及半径，即可购买其中所有出售中的地块、出售或停止出售你的地块，或放弃这些地块。你也可以一次放弃自己拥有的所有地块。"

  protection:
    title: "<red>权限与保护"
    description: "谁能在哪里建造、好友、信任与玩家单独权限、PvP 等开关、通缉犯以及监狱。"
    actions: "四种操作"
    actions-body: "Towny 分别保护四种操作：建造（放置方块）、破坏（破坏方块）、开关（门、按钮、拉杆和容器）以及物品使用（打火石、桶等物品）。"
    groups: "谁能获得权限"
    groups-body: "每种操作可以对不同玩家群体允许或禁止。在城镇所有的土地上，群体为居民、国家成员、盟友和外人；在居民拥有的地块上，群体为好友、城镇居民、盟友和外人。"
    town: "城镇权限"
    town-body: "镇长决定谁能在城镇仍拥有的土地上建造、破坏和交互，无人购买的地块都遵循这些设置。"
    personal: "你的地块权限"
    personal-body: "你的个人权限适用于你拥有的每个地块。在个人资料中设置一次即可：你购买的地块会沿用它们，你仍可以在地块菜单中单独调整某个地块。"
    friends: "好友"
    friends-body: "好友适用你地块上的好友权限，这样你信任的人可以在你的地块建造，而无需向整个城镇开放。"
    trust: "受信任的玩家与城镇"
    trust-body: "镇长可以信任居民，或信任另一个城镇的全部居民，让他们无视权限在城镇任意位置建造。地块主可以在单个地块上信任玩家。"
    flags: "PvP、火焰、爆炸与生物"
    flags-body: "这些开关分别存在于每个世界、每个城镇、每个地块以及你自己的地块上。服务器可以在某个世界强制开启它们，无视城镇设置。和平的城镇和国家会保持 PvP 关闭。"
    outlaws: "通缉犯"
    outlaws-body: "镇长和受信任的职位可以将捣乱者宣布为通缉犯。视服务器设置而定，通缉犯进入城镇时会收到警告或被传送走，还可能被关进监狱。"
    jail: "监狱"
    jail-body: "城镇可以把玩家关进监狱地块，例如在城镇中被击杀的通缉犯或敌人。被关押的玩家需要服满刑期，或在个人资料中支付保释金提前出狱。"
    overrides: "玩家单独权限"
    overrides-body: "地块主可以为个别玩家单独设置在地块上的建造、破坏、开关和物品使用权限，不论其属于哪个群体。在地块权限的“玩家单独权限”中添加玩家，然后在 Towny 的编辑器中修改其权限。"
    jailing: "关押玩家"
    jailing-body: "镇长和治安官可以在城镇监狱菜单中关押在线居民，选择刑期、保释金、监狱和牢房，也可以提前释放囚犯。监狱是类型为“监狱”的地块，站在其中时可在地块菜单中添加牢房。"

  nations:
    title: "<aqua>国家"
    description: "国家是什么、加入与建立国家、成员城镇、外交、制裁、等级、设置以及出生点。"
    what: "什么是国家？"
    what-body: "国家由多个城镇组成，首都城镇的镇长就是国王。国家共享银行、出生点、盟友和敌人，成员城镇还可能获得额外领地。"
    join: "加入国家"
    join-body: "只有镇长可以带领城镇加入国家。开放的国家接受任何城镇；其他国家必须邀请你的城镇，邀请会出现在邀请菜单中。"
    found: "建立国家"
    found-body: "城镇未加入国家的镇长可以建立国家。其城镇成为首都，镇长成为国王。"
    towns: "城镇与首都"
    towns-body: "国王和助理可以邀请或移除城镇。国王可以把首都迁到其他成员城镇，或把领导权交给首都的居民。"
    relations: "盟友与敌人"
    relations-body: "国家可以提议结盟（需对方国家接受），也可以将其他国家宣布为敌人。盟友之间不能互相伤害，还可以在你的土地上获得权限。视服务器设置而定，在你城镇中被击杀的敌人可能被关进监狱。"
    settings: "国家设置"
    settings-body: "开放让任何城镇无需邀请即可加入，公开让外人可以使用国家出生点，和平则让成员城镇远离 PvP 与战争。"
    spawn: "国家出生点"
    spawn-body: "成员可以传送到国家出生点，国家设置允许时盟友和访客也可以。国王可以在国家详情中移动出生点。"
    sanctions: "制裁"
    sanctions-body: "国家可以制裁国家外的城镇，受制裁城镇的居民无法传送到国家传送点。可在国家的城镇菜单中管理受制裁城镇。"
    level: "国家等级"
    level-body: "在国家菜单中点击顶部的国家图标，即可查看等级、升级条件、每个成员城镇获得的额外领地、前哨和国家区域，以及国家的每日维护费。"

  economy:
    title: "<gold>金钱与税收"
    description: "Towny 日、价格、银行、税收、维护费以及破产。"
    day: "Towny 日"
    day-body: "Towny 每天收取一次税款和维护费。无法支付欠款的城镇和居民将承担下面几节课中说明的后果。"
    bank: "城镇与国家银行"
    bank-body: "城镇和国家各自在银行中存钱。任何人都可以存款，取款则需要相应的职位。银行用于支付领地、维护费及其他城镇开支。"
    resident-tax: "居民税"
    resident-tax-body: "镇长设定每位居民每天向城镇银行缴纳的税款，可以是固定金额，也可以是余额的百分比。无法缴税的居民可能会被移出城镇。"
    plot-tax: "地块税"
    plot-tax-body: "收税地块的主人还要每天缴纳地块税，商店和大使馆有各自的税率。无法缴税的地块主可能会失去地块。"
    upkeep: "维护费"
    upkeep-body: "城镇银行每天向服务器支付维护费，通常随城镇规模增长。国家也会从自己的银行支付维护费。"
    nation-tax: "国家税"
    nation-tax-body: "国家每天从每个成员城镇的银行收取税款。无法缴税的城镇可能会被移出国家。"
    bankruptcy: "债务与破产"
    bankruptcy-body: "启用破产时，无法支付维护费的城镇会负债，而不会直接失去。破产的城镇在还清债务前无法占领土地或招募居民。未启用时，城镇会沦为废墟或被删除。无论哪种情况，TownyMenu 都会在聊天中提醒镇长。"
    prices: "价格与下一天"
    prices-body: "主菜单中的“价格与新的一天”会倒计时下一个 Towny 日，并列出本服务器在建立、占领、维护、地块和税款方面的收费。需要花钱的按钮也会显示各自的价格，因此你在点击前就能看到占领、传送或购买地块要花多少。"

  profile:
    title: "<green>个人资料"
    description: "你的资料、其他玩家、你的地块与税款、探索时能看到的信息以及出生点。"
    menu: "你的资料"
    menu-body: "个人资料显示你的城镇、职位、好友、地块和余额。写一段简短的介绍，其他玩家查看你的资料时就能看到。"
    others: "其他玩家"
    others-body: "在城镇、国家或好友列表中点击任意居民即可查看其资料。你可以在那里添加好友，镇长还可以邀请、信任、授予职位或踢出对方。"
    display: "边界、标题与信息工具"
    display-body: "个人设置会改变你探索时看到的内容：进入城镇时的标题、地块和城镇周围的粒子边界、进入新区块时的聊天地图，以及显示方块归属的信息工具。个人资料中的“显示模式”可以一次关闭所有模式，或恢复服务器默认设置。"
    spawn: "出生点"
    spawn-body: "前往出生点会把你传送到城镇出生点；开启床出生点时则传送到你的床。视服务器设置而定，传送可能需要费用并有冷却时间。"
    standing: "地块、税款与处境"
    standing-body: "个人资料底部列出你拥有的所有地块、下一个新的一天需缴纳的税款、将你列为通缉犯的城镇，以及信任你在其中建造的城镇。"
