# TownyMenu - 简体中文 (zh_CN)
#
# 文本使用 MiniMessage 格式 (https://docs.advntr.dev/minimessage/format.html)。请保留所有 {占位符}，TownyMenu 会自动填入。
# 此文件中缺失的键会先使用插件内置的同语言文件，再使用英文。
# 修改后请执行 /townymenu reload。
#
# 颜色遵循统一的配色，让同类文字在所有菜单中保持一致：
#   <gray> 标签与说明            <white> 普通数值、玩家名称
#   <gold> 金钱、城镇、领导者    <aqua> 国家
#   <green> 数量、土地、地块、盟友  <yellow> 日期与时间、菜单和按钮名称
#   <light_purple> 出生点与前哨   <red> 危险、PvP、敌人、通缉犯、监狱
# 点击提示以“！”结尾：左键或点击用 <yellow>，右键用 <aqua>，删除或移除类操作用 <red>。

command:
  usage: "用法: /{command} <子命令>"
  available: "可用子命令: {commands}"
  unknown: "<red>未知子命令: {command}"
  no-permission: "<red>你没有权限使用此命令！"
  # 帮助列表为纯文本，不能使用 MiniMessage 标签。
  help:
    header: "TownyMenu 命令"
    description: "显示所有可用命令"
  reload:
    description: "重新加载插件配置与翻译"
    done: "配置已重新加载！"
    error: "<red>错误: 插件实例类型不匹配，无法重新加载配置。"
  admin:
    description: "打开服务器管理菜单"
    players-only: "<red>只有玩家可以打开管理菜单。"
  tutorial:
    description: "了解城镇、地块和国家的玩法"
    players-only: "<red>只有玩家可以打开教程。"
  invites:
    description: "处理城镇、国家与结盟邀请"
    players-only: "<red>只有玩家可以打开邀请菜单。"
  borders:
