  unjail: "<green>释放出狱"
  unjail-description: "将该居民从<red>监狱</red>中释放。"
  delete: "<dark_red>删除居民"
  delete-description: "删除该居民的 Towny 数据。其下次加入时 Towny 会创建新记录。"

