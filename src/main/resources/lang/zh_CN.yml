  click-read: "<yellow>点击标记为已读！"
  click-unread: "<yellow>点击标记为未读！"
  requires-town: "<red>加入城镇后才能打开此菜单。"
  requires-no-town: "<red>只有不在城镇中的玩家才能打开此菜单。"
  requires-nation: "<red>你的城镇需要加入国家才能打开此菜单。"
