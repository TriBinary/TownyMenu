  nation-ranks-description: "<gold>国王</gold>可授予居民的<yellow>职位</yellow>，以及每个职位允许的操作。"
  ranks-count: "<gray>职位：<green>{count}"
  node-count: "<gray>权限数：<green>{count}"
  node-label: "权限节点"
  click-remove: "<red>点击移除此权限！"
  right-remove: "<aqua>右键删除此职位！"
  add-node: "<green>添加权限"
  add-node-description: "为此权限组添加一个权限节点。"
  add-rank: "<green>添加职位"
  add-rank-description: "创建一个<yellow>职位</yellow>，随后可为其添加权限。"
  rank-label: "职位名称"
  rename-rank: "<yellow>重命名职位"
  rename-rank-description: "重命名<yellow>职位</yellow>，并保留已持有该职位的居民。"

