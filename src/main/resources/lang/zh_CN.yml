  kick: "<red>踢出城镇"
  kick-description: "将该居民移出其城镇。"
  add-to-town: "<green>加入城镇"
  add-to-town-description: "无需邀请，将该居民加入某个城镇。"
  rename-description: "重命名该居民的 Towny 记录，例如在其更改 Minecraft 名称之后。"
  npc: "<gray>NPC"
