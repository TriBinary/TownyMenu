  groups-count: "<gray>Groups: <green>{count}"
  group-title: "Group: {group}"
  town-ranks: "Town Ranks"
  town-ranks-description: "The <yellow>ranks</yellow> a <gold>mayor</gold> can give residents, and what each one allows."
  nation-ranks: "Nation Ranks"
  nation-ranks-description: "The <yellow>ranks</yellow> a <gold>nation leader</gold> can give residents, and what each one allows."
  ranks-count: "<gray>Ranks: <green>{count}"
  node-count: "<gray>Permissions: <green>{count}"
  node-label: "Permission node"
  click-remove: "<red>Click to remove this permission!"
  right-remove: "<aqua>Right-click to delete this rank!"
  add-node: "<green>Add a Permission"
  add-node-description: "Give this group another permission node."
  add-rank: "<green>Add a Rank"
  add-rank-description: "Create a rank that can then be given permissions."
  rank-label: "Rank name"
  rename-rank: "<yellow>Rename a Rank"
  rename-rank-description: "Rename a rank and keep it on the residents who hold it."

admin-resident:
  title: "Admin: {name}"
  jailed: "<red>Jailed"
  npc-line: "<gray>NPC"
  kick: "<red>Kick from Town"
  kick-description: "Remove this resident from their town."
  add-to-town: "<green>Add to Town"
  add-to-town-description: "Put this resident in a town without an invite."
  rename-description: "Rename this resident's Towny record, for example after a Minecraft name change."
  npc: "<gray>NPC"
  npc-description: "Mark this resident as an NPC, such as a placeholder <gold>mayor</gold>."
  unjail: "<green>Release from Jail"
  unjail-description: "Free this resident from <red>jail</red>."
  delete: "<dark_red>Delete Resident"
  delete-description: "Delete this resident's Towny data. Towny creates a new record when they next join."

tutorial:
  title: "Tutorial"
  hub: "<light_purple>TownyMenu Tutorial"
  hub-description: "Everything worth knowing about Towny, one chapter at a time. Each lesson can take you straight to the menu it explains."
  progress: "<gray>Read: <green>{read}<gray>/<green>{total}"
  all-read: "<green>You have read every lesson!"
  continue: "<green>Continue Reading"
  continue-description: "Open the first chapter with lessons you haven't read."
  chapter-line: "<gray>Chapter: {chapter}"
  chapter-title: "Tutorial: {chapter}"
  chapter-complete: "<green>✔ Chapter complete"
  click-open-menu: "<yellow>Click to open this menu!"
  previous-chapter: "<yellow>Previous Chapter"
  next-chapter: "<yellow>Next Chapter"
  mark-all-read: "<green>Mark Chapter as Read"
  mark-all-unread: "<yellow>Mark Chapter as Unread"
  reset: "<red>Reset Progress"
  reset-description: "Mark every lesson as unread."
  reset-confirm: "Mark every tutorial lesson as unread?"
  lesson-read: "<green>✔ {lesson}"
  lesson-unread: "<yellow>{lesson}"
  status-read: "<green>Read"
  status-unread: "<gray>Not read yet"
  left-open: "<yellow>Left-click to open this menu!"
  right-read: "<aqua>Right-click to mark as read!"
  right-unread: "<aqua>Right-click to mark as unread!"
  click-read: "<yellow>Click to mark as read!"
  click-unread: "<yellow>Click to mark as unread!"
  requires-town: "<red>Join a town to open this menu."
  requires-no-town: "<red>Only players without a town can open this menu."
  requires-nation: "<red>Your town must be in a nation to open this menu."
  requires-town-no-nation: "<red>Only residents of a town without a nation can open this menu."
  help: "<light_purple>Tutorial"
  help-description: "Learn how this menu and the Towny features behind it work."
  join-hint: "<yellow>New to towns? <click:run_command:'/townymenu tutorial'><hover:show_text:'<gray>/townymenu tutorial'><green><u>Open the tutorial</u></green></hover></click> <yellow>to learn how towns, plots, and nations work."

  # Live values from this server's Towny settings, shown under a lesson.
  fact:
    shortcut: "<gray>Sneak + swap-hand shortcut: {value}"
    world-no-towny: "<gray>Towny is turned off in this world."
    wild-build: "<gray>Building in this world's wilderness: {value}"
    wild-destroy: "<gray>Breaking in this world's wilderness: {value}"
    town-cost: "<gray>Founding a town costs: <gold>{cost}"
    town-distance: "<gray>Minimum distance from other towns: <green>{distance} chunks"
    max-residents: "<gray>Most residents a town can have: <green>{count}"
    claims-per-resident: "<gray>Claims added per resident: <green>{count}"
    visitor-spawn-cost: "<gray>Your town's spawn cost for visitors: <gold>{cost}"
    peaceful-cost: "<gray>Daily cost of being peaceful: <gold>{cost}"
    ruins: "<gray>Town ruins: {value}"
    ruins-hours: "<gray>Ruins last up to: <yellow>{hours} hours"
    ruins-reclaim: "<gray>Ruins can be reclaimed: {value}"
    chunk-size: "<gray>Each claim is <green>{size}×{size}</green> blocks."
    claim-cost: "<gray>Price per claim: <gold>{cost}"
    claim-increase: "<gray>The price rises <green>{percent}%</green> with each claim."
    claim-refund: "<gray>Refund per unclaimed chunk: <gold>{cost}"
    outposts-disabled: "<red>Outposts are turned off on this server."
    outpost-cost: "<gray>Price per outpost: <gold>{cost}"
    bonus-cost: "<gray>Price per bonus claim: <gold>{cost}"
    jail-hours: "<gray>Longest jail sentence: <yellow>{hours} hours"
    jailed: "<red>You are jailed: {hours} hours left."
    join-nation-residents: "<gray>Residents a town needs to join a nation: <green>{count}"
    nation-cost: "<gray>Founding a nation costs: <gold>{cost}"
    create-nation-residents: "<gray>Residents a town needs to found a nation: <green>{count}"
    nation-spawn: "<gray>Nation spawns: {value}"
    new-day: "<gray>A new day starts at: <yellow>{time}</yellow> (server time)"
    daily-taxes: "<gray>Daily taxes: {value}"
    town-upkeep: "<gray>Town upkeep per day: <gold>{cost}"
    nation-upkeep: "<gray>Your nation's upkeep per day: <gold>{cost}"
    bankruptcy: "<gray>Town bankruptcy: {value}"
    debt: "<red>Your town is bankrupt and owes {debt}."
    merge-cost: "<gray>Base cost of merging towns: <gold>{cost}"
    merge-distance: "<gray>Furthest merge distance: <green>{distance} chunks"
    reclaim-cost: "<gray>Reclaiming ruins costs: <gold>{cost}"
    reclaim-townless: "<gray>Players without a town can reclaim ruins: {value}"
    bail: "<gray>Default bail: <gold>{cost}"
    max-bail: "<gray>Highest bail: <gold>{cost}"

  start:
    title: "<aqua>Getting Started"
    description: "What Towny is, how to open and read these menus, the <green>wilderness</green>, the map, invites, and leaderboards."
    towny: "What Is Towny?"
    towny-body: "Towny lets players protect <green>land</green> by founding towns. A town <green>claims</green> chunks that outsiders can't grief, collects <gold>taxes</gold>, and can join other towns in a nation. Land nobody has claimed is the wilderness."
    menus: "Opening the Menus"
    menus-body: "Type /tm, or press swap-hand (F) while sneaking, to open the <yellow>main menu</yellow>. Clicking the TownyMenu prefix in chat opens it too. Every button runs the matching Towny command for you, with Towny's own costs and rules."
    buttons: "Reading the Buttons"
    buttons-body: "Hover over a button to read what it does. A grey dye means you lack the permission for that action. Switches glow while they are on. Names and amounts are typed into a dialog, and anything that <red>can't be undone</red> asks you to confirm first."
    wilderness: "The Wilderness"
    wilderness-body: "Unclaimed <green>land</green> belongs to no one. Depending on the world, you may be able to build there, but nothing you build is protected. Settle in a town to keep your work safe."
    map: "The Map"
    map-body: "The map shows the <green>chunks</green> around you, coloured by who owns them: your town, your <green>plots</green>, your nation, allies, <red>enemies</red>, and other towns. Glowing tiles are for sale. Click a claimed tile to view its town, or right-click a tile for sale to buy it."
    invites: "Invites"
    invites-body: "Towns invite players, nations invite towns, and nations send each other <green>alliance</green> requests. Every pending invitation waits in the <yellow>Invites menu</yellow>, where you can accept or decline it. TownyMenu also tells you in chat when one arrives, and that message opens the menu."
    leaderboards: "Leaderboards"
    leaderboards-body: "The <yellow>Leaderboards menu</yellow> ranks towns and nations by residents, land, and <gold>bank</gold> balance, and players by the <green>plots</green> they own. Click any entry to open it."

  join:
    title: "<gold>Finding a Town"
    description: "Why towns matter, joining one, founding your own, and leaving."
    why: "Why Join a Town?"
    why-body: "Town residents share protected <green>land</green>, can own <green>plots</green>, can teleport to the town <light_purple>spawn</light_purple>, and take part in their town's nation. Builds in the wilderness have none of that protection."
    browse: "Joining a Town"
    browse-body: "Browse the <yellow>town directory</yellow> and sort it by residents, <green>claims</green>, openness, or distance from you. Open towns let anyone join with one click. Other towns need their <gold>mayor</gold> or an assistant to invite you."
    invites: "Accepting an Invite"
    invites-body: "When a town invites you, accept it in the <yellow>Invites menu</yellow>. You can only live in one town at a time. Turn on <yellow>Ignore Invites</yellow> in your <yellow>personal settings</yellow> if you don't want any."
    found: "Founding a Town"
    found-body: "Stand where you want your town and choose <yellow>Found a Town</yellow>. The chunk you stand in becomes the town's <gold>home block</gold> and spawn, and you become its <gold>mayor</gold>. Your town must be far enough from other towns."
    leave: "Leaving a Town"
    leave-body: "Residents can leave from the <yellow>town menu</yellow>. A <gold>mayor</gold> can't leave: hand the town to another resident first, or delete it. Plots you own go back to the town when you leave."

  town:
    title: "<gold>Running a Town"
    description: "Levels, <yellow>ranks</yellow>, recruiting, <light_purple>spawn</light_purple>, settings, details, announcements, merging, selling, and <red>ruins</red>."
    ranks: "Mayor and Ranks"
    ranks-body: "The <gold>mayor</gold> can do everything. Ranks such as assistant, sheriff, or builder share part of that power, and the server decides exactly what each rank may do. Assign <yellow>ranks</yellow> from a resident's profile in the <yellow>Residents menu</yellow>."
    grow: "Growing Your Town"
    grow-body: "Invite players from the <yellow>Residents menu</yellow>, or make the town Open so anyone can join. More residents usually raise how much <green>land</green> your town can <green>claim</green>."
    spawn: "Spawn and Home Block"
    spawn-body: "The <gold>home block</gold> is the heart of your town and holds the town <light_purple>spawn</light_purple>. Residents can <light_purple>teleport</light_purple> there from the <yellow>town menu</yellow>, and visitors can too while the town is Public. Mayors move the spawn and home block in <yellow>Town Details</yellow>."
    settings: "Town Settings"
    settings-body: "<red>PvP</red>, hostile mobs, <gold>fire spread</gold>, and <dark_red>explosions</dark_red> are switched on or off for the whole town. Open lets anyone join without an invite, Public lets visitors use your spawn, and Peaceful keeps the town out of PvP and <red>war</red>. Towns in a nation can also switch off the <aqua>nation zone</aqua> that protects the land around them."
    details: "Name, Board, and Tag"
    details-body: "In <yellow>Town Details</yellow>, mayors rename the town, write the board message residents see when they log in, set a short chat tag, and choose the town's map colour."
    sell: "Selling a Town"
    sell-body: "A mayor can put the town up for sale in <yellow>Town Details</yellow>. Whoever buys it pays the <gold>price</gold> and becomes the new mayor. Towns for sale are marked in the <yellow>town directory</yellow>."
    ruins: "Ruins and Deleting"
    ruins-body: "Deleting a town gives all its <green>land</green> back to the wilderness. When <red>ruins</red> are on, a deleted or <red>bankrupt</red> town first becomes ruins that open up to everyone over time. Its residents can reclaim it from the <yellow>town menu</yellow> before it disappears, and on some servers players without a town can too, from <yellow>Find a Town</yellow> while standing in the ruins."
    announce: "Announcements"
    announce-body: "Send a message to every online resident with <yellow>Announce to Town</yellow> in the <yellow>Residents menu</yellow>. Nation leaders can do the same for the whole nation from the <yellow>nation menu</yellow>."
    merge: "Merging Towns"
    merge-body: "A <gold>mayor</gold> can ask another town to merge into their own from that town's page in the <yellow>town directory</yellow>. The other mayor must be online and accept, and then their residents, land, and <gold>bank</gold> join your town."
    status: "Town Level and Warnings"
    status-body: "Click your town at the top of the <yellow>town menu</yellow> to see its level, how many residents or <green>claims</green> the next level needs, its <green>land</green> and outpost limits, and the <gold>upkeep</gold> due on the next new day. Anything that needs attention, such as <red>debt</red>, overclaiming, or being conquered, is listed there and on the town icon."

  claims:
    title: "<green>Claiming Land"
    description: "Chunks and <green>claim</green> limits, claiming and unclaiming, outposts, <green>bonus claims</green>, and ceding or taking over <green>land</green>."
    chunks: "Claims Are Chunks"
    chunks-body: "Towns <green>claim</green> land one chunk at a time, called a town block. Every claimed chunk is protected by your town's permissions. How many chunks you can claim depends on your residents and any <green>bonus claims</green>."
    claim: "Claiming Land"
    claim-body: "Stand next to your town and <green>claim</green> the chunk you are in, a square area around you, or the gaps your town surrounds. New claims must touch <green>land</green> your town already owns."
    auto: "Auto Claim"
    auto-body: "Turn on <yellow>Auto Claim</yellow> and walk around: each <green>chunk</green> you step into is claimed while your town can afford it and has claims left. Turn it off again when you are done."
    unclaim: "Unclaiming Land"
    unclaim-body: "Unclaim <green>chunks</green> you no longer need to free their claim slots. The <gold>home block</gold> can't be unclaimed. Some servers slowly restore unclaimed <green>land</green> to how it looked before."
    outposts: "Outposts"
    outposts-body: "An <light_purple>outpost</light_purple> is a <green>claim</green> away from your town, such as a distant mine or farm. Each outpost has a spawn that residents can teleport to, and more <green>land</green> can be claimed around it. A <gold>mayor</gold> can also turn an existing claim into an outpost, or move an outpost's spawn, from the <yellow>Plot menu</yellow>."
    bonus: "Bonus Claims"
    bonus-body: "Reached your claim limit? Buy bonus claims with <gold>money</gold> from the town <gold>bank</gold>. The <gold>price</gold> can rise with each one you buy."
    cede: "Ceding Land"
    cede-body: "Stand in one of your town's <green>chunks</green> and choose <yellow>Cede This Plot</yellow> to give it to another town, for example to settle a border. The other town's <gold>mayor</gold> must be online to accept. The <gold>home block</gold> can't be ceded."
    takeover: "Taking Over Claims"
    takeover-body: "A town with more <green>land</green> than its <green>claim</green> limit is <red>overclaimed</red>. Your town can take over chunks at the edge of an overclaimed town that touch your own land with <yellow>Take Over Claim</yellow>. Depending on the server, your nations may have to be <red>enemies</red>."

  plots:
    title: "<yellow>Plots"
    description: "Owning, buying, and selling <green>plots</green>, many plots at once, plot types, settings, <green>trust</green>, join-day limits, and groups."
    what: "What Is a Plot?"
    what-body: "Every <green>chunk</green> a town claims is a <green>plot</green>. The town owns it until a resident buys it, and then the owner decides who may build there. Open the <yellow>Plot menu</yellow> while standing in a plot to see who owns it, click its icon for Towny's full plot info, or turn on the <yellow>Plot HUD</yellow> to see it while you walk."
    buy: "Buying a Plot"
    buy-body: "Plots for sale glow on the map; right-click one there to buy it from afar. Or walk into it, open the <yellow>Plot menu</yellow>, and choose <yellow>Buy Plot</yellow> to pay the <gold>price</gold> and become its owner."
    sell: "Selling and Giving Up"
    sell-body: "Owners and <gold>mayors</gold> can put a <green>plot</green> up for sale; a <gold>price</gold> of 0 gives it away. <yellow>Give Up</yellow> returns your plot to the town. Mayors can evict an owner, and right-clicking Evict Owner puts the plot straight back up for sale."
    types: "Plot Types"
    types-body: "Mayors choose each <green>plot</green>'s type. Shops and embassies have their own <gold>prices</gold> and <gold>taxes</gold>, and embassies can be bought by players from other towns. Arenas always allow <red>PvP</red>, inns let anyone sleep, farms let residents farm, wilds let residents cut trees and mine, and <red>jails</red> hold prisoners."
    settings: "Plot Settings"
    settings-body: "Plot owners switch <red>PvP</red>, fire, <dark_red>explosions</dark_red>, and <dark_green>mobs</dark_green> on their own plot, and mayors choose whether a plot is taxed. The world's own rules still come first."
    trust: "Plot Trust"
    trust-body: "Trust a player on one <green>plot</green> to let them build there without changing the plot's permissions for everyone else."
    groups: "Groups and Districts"
    groups-body: "A <green>plot</green> group bundles several plots so they are sold and managed together, like one big house. While a plot is in a group, its sale, type, settings, permissions, <green>trust</green>, and join-day limits change the whole group. A district names a larger area of plots, such as a market quarter."
    join-days: "Join-Day Limits"
    join-days-body: "Mayors can keep a <green>plot</green> for newcomers or for long-time residents by setting the fewest days, the most days, or both, that a buyer must have lived in the town."
    area: "Many Plots at Once"
    area-body: "From the <yellow>Plot menu</yellow>, pick a square or circle and a radius around you, then buy every <green>plot</green> for sale in it, put your plots up for sale or take them off sale, or give them up. You can also give up every plot you own at once."

  protection:
    title: "<red>Permissions & Protection"
    description: "Who may build where, friends, trust, and player overrides, <red>PvP</red> and other switches, <red>outlaws</red>, and <red>jail</red>."
    actions: "Four Kinds of Actions"
    actions-body: "Towny protects four actions separately: Build (placing blocks), Destroy (breaking blocks), Switch (doors, buttons, levers, and containers), and Item Use (items such as flint and steel or buckets)."
    groups: "Who Gets Permission"
    groups-body: "Each action is allowed or denied for groups of players. On town-owned <green>land</green> the groups are residents, nation members, <green>allies</green>, and outsiders. On <green>plots</green> owned by a resident they are <green>friends</green>, town residents, allies, and outsiders."
    town: "Town Permissions"
    town-body: "Mayors decide who may build, break, and interact on <green>land</green> the town still owns, and <green>plots</green> nobody has bought follow these settings."
    personal: "Your Plot Permissions"
    personal-body: "Your personal permissions apply to every <green>plot</green> you own. Set them once in your profile: plots you buy take them on, and you can still fine-tune a single plot from the <yellow>Plot menu</yellow>."
    friends: "Friends"
    friends-body: "Friends use the <green>friend</green> permissions on your <green>plots</green>, so people you <green>trust</green> can build there without opening your plots to the whole town."
    trust: "Trusted Players and Towns"
    trust-body: "Mayors can <green>trust</green> residents, or every resident of another town, to build anywhere in the town regardless of its permissions. Plot owners can trust players on a single <green>plot</green>."
    flags: "PvP, Fire, Explosions, and Mobs"
    flags-body: "These switches exist for each world, each town, each <green>plot</green>, and your own plots. A server can force them on in a world, ignoring town settings. <white>Peaceful</white> towns and nations keep <red>PvP</red> off."
    outlaws: "Outlaws"
    outlaws-body: "Mayors and <green>trusted</green> ranks can declare troublemakers <red>outlaws</red>. Depending on the server, outlaws are warned or teleported away when they enter the town, and can be <red>jailed</red>."
    jail: "Jail"
    jail-body: "Towns can send players to a <red>jail</red> plot, for example <red>outlaws</red> or <red>enemies</red> killed in town. Jailed players wait out their sentence, or pay bail from their profile to leave early."
    overrides: "Player Overrides"
    overrides-body: "Plot owners can give single players their own build, break, switch, and item-use rights on a <green>plot</green>, whatever group they belong to. Add players under <yellow>Player Overrides</yellow> in the plot's permissions, then edit their rights in Towny's editor."
    jailing: "Jailing Players"
    jailing-body: "Mayors and sheriffs <red>jail</red> online residents from the town's <yellow>Jail menu</yellow>, choosing the sentence, <gold>bail</gold>, jail, and cell, and can release prisoners early. A jail is a <green>plot</green> with the Jail type; add cells to it from the Plot menu while standing inside."

  nations:
    title: "<aqua>Nations"
    description: "What nations are, joining and founding one, member towns, diplomacy, sanctions, levels, settings, and <light_purple>spawn</light_purple>."
    what: "What Is a Nation?"
    what-body: "A nation is a group of towns. The <gold>mayor</gold> of its capital town is the nation leader. Nations share a <gold>bank</gold>, a spawn, allies, and <red>enemies</red>, and member towns can receive extra claims."
    join: "Joining a Nation"
    join-body: "Only a <gold>mayor</gold> can take a town into a nation. Open nations accept any town; other nations must invite your town, and the invitation appears in the <yellow>Invites menu</yellow>."
    found: "Founding a Nation"
    found-body: "A <gold>mayor</gold> whose town has no nation can found one. Their town becomes the <gold>capital</gold>, and they become the <gold>nation leader</gold>."
    towns: "Towns and the Capital"
    towns-body: "The <gold>nation leader</gold> and assistants invite and remove towns. The leader can move the <gold>capital</gold> to another member town, or hand leadership to a resident of the capital."
    relations: "Allies and Enemies"
    relations-body: "Nations propose <green>alliances</green>, which the other nation must accept, and can declare other nations <red>enemies</red>. Allies can't hurt each other and can be given permissions on your <green>land</green>. Depending on the server, enemies killed in your towns can be <red>jailed</red>."
    settings: "Nation Settings"
    settings-body: "Open lets any town join without an invite, Public lets outsiders use the nation <light_purple>spawn</light_purple>, and Peaceful keeps member towns out of <red>PvP</red> and <red>war</red>."
    spawn: "Nation Spawn"
    spawn-body: "Members can teleport to the nation <light_purple>spawn</light_purple>, and so can <green>allies</green> and visitors when the nation's settings allow it. The leader moves the spawn in <yellow>Nation Details</yellow>."
    sanctions: "Sanctions"
    sanctions-body: "A nation can sanction towns outside it, and residents of a sanctioned town can't <light_purple>teleport</light_purple> to the nation <light_purple>spawn</light_purple>. Manage sanctioned towns from the nation's <yellow>Towns menu</yellow>."
    level: "Nation Level"
    level-body: "Click your nation at the top of the <yellow>nation menu</yellow> to see its level, what the next level needs, the bonus claims, outposts, and <aqua>nation zone</aqua> every member town gains, and the nation's daily <gold>upkeep</gold>."

  economy:
    title: "<gold>Money & Taxes"
    description: "The Towny day, prices, banks, taxes, <gold>upkeep</gold>, and <red>bankruptcy</red>."
    day: "The Towny Day"
    day-body: "Once a day Towny collects <gold>taxes</gold> and <gold>upkeep</gold>. Towns and residents that can't pay what they owe face the consequences explained in the lessons below."
    bank: "Town and Nation Banks"
    bank-body: "Towns and nations keep <gold>money</gold> in their own <gold>bank</gold>. Anyone can deposit; withdrawing needs the right rank. The bank pays for claims, <gold>upkeep</gold>, and other town costs."
    resident-tax: "Resident Taxes"
    resident-tax-body: "Mayors set a daily <gold>tax</gold> every resident pays into the town <gold>bank</gold>, either a flat amount or a percentage of their balance. A resident who can't pay may be removed from the town."
    plot-tax: "Plot Taxes"
    plot-tax-body: "Owners of taxed <green>plots</green> also pay a daily plot <gold>tax</gold>, with separate rates for shops and embassies. An owner who can't pay may lose the plot."
    upkeep: "Upkeep"
    upkeep-body: "Every day the town <gold>bank</gold> pays the server <gold>upkeep</gold>, which usually grows with the town's size. Nations pay upkeep from their own bank too."
    nation-tax: "Nation Taxes"
    nation-tax-body: "Nations charge each member town a daily <gold>tax</gold> from its <gold>bank</gold>. A town that can't pay may be removed from the nation."
    bankruptcy: "Debt and Bankruptcy"
    bankruptcy-body: "When <red>bankruptcy</red> is on, a town that can't pay its <gold>upkeep</gold> goes into debt instead of being lost. A bankrupt town can't <green>claim</green> land or recruit until the debt is paid. Otherwise the town falls into <red>ruin</red> or is deleted. Either way TownyMenu warns the <gold>mayor</gold> in chat."
    prices: "Prices and the Next Day"
    prices-body: "<yellow>Prices & New Day</yellow>, on the <yellow>main menu</yellow>, counts down to the next Towny day and lists what this server charges for founding, claiming, <gold>upkeep</gold>, plots, and <gold>taxes</gold>. Buttons that cost <gold>money</gold> also show their own price, so you can see what a claim, a teleport, or a plot takes before you click it."

  profile:
    title: "<green>Your Profile"
    description: "Your profile, other players, your <green>plots</green> and <gold>taxes</gold>, what you see while exploring, and spawning."
    menu: "Your Profile"
    menu-body: "Your profile shows your town, <yellow>ranks</yellow>, friends, <green>plots</green>, and balance. Write a short bio that other players see when they look at your profile."
    others: "Other Players"
    others-body: "Click any resident in a town, nation, or <green>friends</green> list to view their profile. From there you can add them as a friend, and <gold>mayors</gold> can invite, <green>trust</green>, rank, or kick them."
    display: "Borders, Titles, and the Info Tool"
    display-body: "<yellow>Personal settings</yellow> change what you see while exploring: a title when you cross into a town, particle borders around <green>plots</green> and towns, a chat map in every new <green>chunk</green>, and an info tool that shows who owns a block. <yellow>Display Modes</yellow> in your profile turns every mode off at once, or restores the server's defaults."
    border-view: "Border View"
    border-view-body: "<yellow>Border View</yellow>, on the map or with /townymenu borders, draws a short wall of particles along every border near you, coloured like the map: your town, your nation, <green>allies</green>, <red>enemies</red>, and other towns each get their own colour. <aqua>Nation</aqua> borders are taller and thicker, and the plots you own get a low yellow line."
    spawn: "Spawning"
    spawn-body: "<yellow>Go to Spawn</yellow> teleports you to your town <light_purple>spawn</light_purple>, or to your bed while Bed Spawn is on. Spawning may cost <gold>money</gold> and have a cooldown, depending on the server."
    standing: "Plots, Taxes, and Standing"
    standing-body: "The bottom of your profile lists every <green>plot</green> you own, what you will pay in <gold>tax</gold> on the next new day, the towns that <red>outlaw</red> you, and the towns that trust you to build in them."
