# TownyMenu - English (en_US)
#
# Values are MiniMessage (https://docs.advntr.dev/minimessage/format.html). Keep every {placeholder}: TownyMenu fills
# them in. Keys missing here fall back to the bundled copy of this file, then to English.
# Run /townymenu reload after editing.
#
# Colours follow one palette, so the same kind of text looks the same in every menu:
#   <gray> labels and descriptions      <white> neutral values, player names
#   <gold> money, towns, leadership     <aqua> nations
#   <green> counts, land, plots, allies <yellow> dates and times, menu and button names
#   <light_purple> spawns and outposts  <red> danger, PvP, enemies, outlaws, jail
# Click hints end with "!": <yellow> for a click or left-click, <aqua> for a right-click,
# <red> when the click destroys or removes something.

