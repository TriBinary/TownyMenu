  start:
    title: "<aqua>Getting Started"
    description: "What Towny is, how to open and read these menus, the wilderness, the map, invites, and leaderboards."
    towny: "What Is Towny?"
    towny-body: "Towny lets players protect land by founding towns. A town claims chunks that outsiders can't grief, collects taxes, and can join other towns in a nation. Land nobody has claimed is the wilderness."
    menus: "Opening the Menus"
    menus-body: "Type /tm, or press swap-hand (F) while sneaking, to open the main menu. Clicking the TownyMenu prefix in chat opens it too. Every button runs the matching Towny command for you, with Towny's own costs and rules."
    buttons: "Reading the Buttons"
    buttons-body: "Hover over a button to read what it does. A grey dye means you lack the permission for that action. Switches glow while they are on. Names and amounts are typed into a dialog, and anything that can't be undone asks you to confirm first."
    wilderness: "The Wilderness"
    wilderness-body: "Unclaimed land belongs to no one. Depending on the world, you may be able to build there, but nothing you build is protected. Settle in a town to keep your work safe."
    map: "The Map"
    map-body: "The map shows the chunks around you, coloured by who owns them: your town, your plots, your nation, allies, enemies, and other towns. Glowing tiles are for sale. Click a claimed tile to view its town, or right-click a tile for sale to buy it."
    invites: "Invites"
    invites-body: "Towns invite players, nations invite towns, and nations send each other alliance requests. Every pending invitation waits in the Invites menu, where you can accept or decline it. TownyMenu also tells you in chat when one arrives, and that message opens the menu."
    leaderboards: "Leaderboards"
    leaderboards-body: "The Leaderboards menu ranks towns and nations by residents, land, and bank balance, and players by the plots they own. Click any entry to open it."

  join:
    title: "<gold>Finding a Town"
    description: "Why towns matter, joining one, founding your own, and leaving."
    why: "Why Join a Town?"
    why-body: "Town residents share protected land, can own plots, can teleport to the town spawn, and take part in their town's nation. Builds in the wilderness have none of that protection."
    browse: "Joining a Town"
    browse-body: "Browse the town directory and sort it by residents, claims, openness, or distance from you. Open towns let anyone join with one click. Other towns need their mayor or an assistant to invite you."
    invites: "Accepting an Invite"
    invites-body: "When a town invites you, accept it in the Invites menu. You can only live in one town at a time. Turn on Ignore Invites in your personal settings if you don't want any."
    found: "Founding a Town"
    found-body: "Stand where you want your town and choose Found a Town. The chunk you stand in becomes the town's home block and spawn, and you become its mayor. Your town must be far enough from other towns."
    leave: "Leaving a Town"
    leave-body: "Residents can leave from the town menu. A mayor can't leave: hand the town to another resident first, or delete it. Plots you own go back to the town when you leave."

  town:
    title: "<gold>Running a Town"
    description: "Levels, ranks, recruiting, spawn, settings, details, announcements, merging, selling, and ruins."
    ranks: "Mayor and Ranks"
    ranks-body: "The mayor can do everything. Ranks such as assistant, sheriff, or builder share part of that power, and the server decides exactly what each rank may do. Assign ranks from a resident's profile in the Residents menu."
    grow: "Growing Your Town"
    grow-body: "Invite players from the Residents menu, or make the town Open so anyone can join. More residents usually raise how much land your town can claim."
    spawn: "Spawn and Home Block"
    spawn-body: "The home block is the heart of your town and holds the town spawn. Residents can teleport there from the town menu, and visitors can too while the town is Public. Mayors move the spawn and home block in Town Details."
    settings: "Town Settings"
    settings-body: "PvP, hostile mobs, fire spread, and explosions are switched on or off for the whole town. Open lets anyone join without an invite, Public lets visitors use your spawn, and Peaceful keeps the town out of PvP and war. Towns in a nation can also switch off the nation zone that protects the land around them."
    details: "Name, Board, and Tag"
    details-body: "In Town Details, mayors rename the town, write the board message residents see when they log in, set a short chat tag, and choose the town's map colour."
    sell: "Selling a Town"
    sell-body: "A mayor can put the town up for sale in Town Details. Whoever buys it pays the price and becomes the new mayor. Towns for sale are marked in the town directory."
    ruins: "Ruins and Deleting"
    ruins-body: "Deleting a town gives all its land back to the wilderness. When ruins are on, a deleted or bankrupt town first becomes ruins that open up to everyone over time. Its residents can reclaim it from the town menu before it disappears, and on some servers players without a town can too, from Find a Town while standing in the ruins."
    announce: "Announcements"
    announce-body: "Send a message to every online resident with Announce to Town in the Residents menu. Nation leaders can do the same for the whole nation from the nation menu."
    merge: "Merging Towns"
    merge-body: "A mayor can ask another town to merge into their own from that town's page in the town directory. The other mayor must be online and accept, and then their residents, land, and bank join your town."
    status: "Town Level and Warnings"
    status-body: "Click your town at the top of the town menu to see its level, how many residents or claims the next level needs, its land and outpost limits, and the upkeep due on the next new day. Anything that needs attention, such as debt, overclaiming, or being conquered, is listed there and on the town icon."

  claims:
    title: "<green>Claiming Land"
    description: "Chunks and claim limits, claiming and unclaiming, outposts, bonus claims, and ceding or taking over land."
    chunks: "Claims Are Chunks"
    chunks-body: "Towns claim land one chunk at a time, called a town block. Every claimed chunk is protected by your town's permissions. How many chunks you can claim depends on your residents and any bonus claims."
    claim: "Claiming Land"
    claim-body: "Stand next to your town and claim the chunk you are in, a square area around you, or the gaps your town surrounds. New claims must touch land your town already owns."
    auto: "Auto Claim"
    auto-body: "Turn on Auto Claim and walk around: each chunk you step into is claimed while your town can afford it and has claims left. Turn it off again when you are done."
    unclaim: "Unclaiming Land"
    unclaim-body: "Unclaim chunks you no longer need to free their claim slots. The home block can't be unclaimed. Some servers slowly restore unclaimed land to how it looked before."
    outposts: "Outposts"
    outposts-body: "An outpost is a claim away from your town, such as a distant mine or farm. Each outpost has a spawn that residents can teleport to, and more land can be claimed around it. A mayor can also turn an existing claim into an outpost, or move an outpost's spawn, from the Plot menu."
    bonus: "Bonus Claims"
    bonus-body: "Reached your claim limit? Buy bonus claims with money from the town bank. The price can rise with each one you buy."
    cede: "Ceding Land"
    cede-body: "Stand in one of your town's chunks and choose Cede This Plot to give it to another town, for example to settle a border. The other town's mayor must be online to accept. The home block can't be ceded."
    takeover: "Taking Over Claims"
    takeover-body: "A town with more land than its claim limit is overclaimed. Your town can take over chunks at the edge of an overclaimed town that touch your own land with Take Over Claim. Depending on the server, your nations may have to be enemies."

  plots:
    title: "<yellow>Plots"
    description: "Owning, buying, and selling plots, many plots at once, plot types, settings, trust, join-day limits, and groups."
    what: "What Is a Plot?"
    what-body: "Every chunk a town claims is a plot. The town owns it until a resident buys it, and then the owner decides who may build there. Open the Plot menu while standing in a plot to see who owns it, click its icon for Towny's full plot info, or turn on the Plot HUD to see it while you walk."
    buy: "Buying a Plot"
    buy-body: "Plots for sale glow on the map; right-click one there to buy it from afar. Or walk into it, open the Plot menu, and choose Buy Plot to pay the price and become its owner."
    sell: "Selling and Giving Up"
    sell-body: "Owners and mayors can put a plot up for sale; a price of 0 gives it away. Give Up returns your plot to the town. Mayors can evict an owner, and right-clicking Evict Owner puts the plot straight back up for sale."
    types: "Plot Types"
    types-body: "Mayors choose each plot's type. Shops and embassies have their own prices and taxes, and embassies can be bought by players from other towns. Arenas always allow PvP, inns let anyone sleep, farms let residents farm, wilds let residents cut trees and mine, and jails hold prisoners."
    settings: "Plot Settings"
    settings-body: "Plot owners switch PvP, fire, explosions, and mobs on their own plot, and mayors choose whether a plot is taxed. The world's own rules still come first."
    trust: "Plot Trust"
    trust-body: "Trust a player on one plot to let them build there without changing the plot's permissions for everyone else."
    groups: "Groups and Districts"
    groups-body: "A plot group bundles several plots so they are sold and managed together, like one big house. While a plot is in a group, its sale, type, settings, permissions, trust, and join-day limits change the whole group. A district names a larger area of plots, such as a market quarter."
    join-days: "Join-Day Limits"
    join-days-body: "Mayors can keep a plot for newcomers or for long-time residents by setting the fewest days, the most days, or both, that a buyer must have lived in the town."
    area: "Many Plots at Once"
    area-body: "From the Plot menu, pick a square or circle and a radius around you, then buy every plot for sale in it, put your plots up for sale or take them off sale, or give them up. You can also give up every plot you own at once."

  protection:
    title: "<red>Permissions & Protection"
    description: "Who may build where, friends, trust, and player overrides, PvP and other switches, outlaws, and jail."
    actions: "Four Kinds of Actions"
    actions-body: "Towny protects four actions separately: Build (placing blocks), Destroy (breaking blocks), Switch (doors, buttons, levers, and containers), and Item Use (items such as flint and steel or buckets)."
    groups: "Who Gets Permission"
    groups-body: "Each action is allowed or denied for groups of players. On town-owned land the groups are residents, nation members, allies, and outsiders. On plots owned by a resident they are friends, town residents, allies, and outsiders."
    town: "Town Permissions"
    town-body: "Mayors decide who may build, break, and interact on land the town still owns, and plots nobody has bought follow these settings."
    personal: "Your Plot Permissions"
    personal-body: "Your personal permissions apply to every plot you own. Set them once in your profile: plots you buy take them on, and you can still fine-tune a single plot from the Plot menu."
    friends: "Friends"
    friends-body: "Friends use the friend permissions on your plots, so people you trust can build there without opening your plots to the whole town."
    trust: "Trusted Players and Towns"
    trust-body: "Mayors can trust residents, or every resident of another town, to build anywhere in the town regardless of its permissions. Plot owners can trust players on a single plot."
    flags: "PvP, Fire, Explosions, and Mobs"
    flags-body: "These switches exist for each world, each town, each plot, and your own plots. A server can force them on in a world, ignoring town settings. Peaceful towns and nations keep PvP off."
    outlaws: "Outlaws"
    outlaws-body: "Mayors and trusted ranks can declare troublemakers outlaws. Depending on the server, outlaws are warned or teleported away when they enter the town, and can be jailed."
    jail: "Jail"
    jail-body: "Towns can send players to a jail plot, for example outlaws or enemies killed in town. Jailed players wait out their sentence, or pay bail from their profile to leave early."
    overrides: "Player Overrides"
    overrides-body: "Plot owners can give single players their own build, break, switch, and item-use rights on a plot, whatever group they belong to. Add players under Player Overrides in the plot's permissions, then edit their rights in Towny's editor."
    jailing: "Jailing Players"
    jailing-body: "Mayors and sheriffs jail online residents from the town's Jail menu, choosing the sentence, bail, jail, and cell, and can release prisoners early. A jail is a plot with the Jail type; add cells to it from the Plot menu while standing inside."

  nations:
    title: "<aqua>Nations"
    description: "What nations are, joining and founding one, member towns, diplomacy, sanctions, levels, settings, and spawn."
    what: "What Is a Nation?"
    what-body: "A nation is a group of towns. The mayor of its capital town is the nation leader. Nations share a bank, a spawn, allies, and enemies, and member towns can receive extra claims."
    join: "Joining a Nation"
    join-body: "Only a mayor can take a town into a nation. Open nations accept any town; other nations must invite your town, and the invitation appears in the Invites menu."
    found: "Founding a Nation"
    found-body: "A mayor whose town has no nation can found one. Their town becomes the capital, and they become the nation leader."
    towns: "Towns and the Capital"
    towns-body: "The nation leader and assistants invite and remove towns. The leader can move the capital to another member town, or hand leadership to a resident of the capital."
    relations: "Allies and Enemies"
    relations-body: "Nations propose alliances, which the other nation must accept, and can declare other nations enemies. Allies can't hurt each other and can be given permissions on your land. Depending on the server, enemies killed in your towns can be jailed."
    settings: "Nation Settings"
    settings-body: "Open lets any town join without an invite, Public lets outsiders use the nation spawn, and Peaceful keeps member towns out of PvP and war."
    spawn: "Nation Spawn"
    spawn-body: "Members can teleport to the nation spawn, and so can allies and visitors when the nation's settings allow it. The leader moves the spawn in Nation Details."
    sanctions: "Sanctions"
    sanctions-body: "A nation can sanction towns outside it, and residents of a sanctioned town can't teleport to the nation spawn. Manage sanctioned towns from the nation's Towns menu."
    level: "Nation Level"
    level-body: "Click your nation at the top of the nation menu to see its level, what the next level needs, the bonus claims, outposts, and nation zone every member town gains, and the nation's daily upkeep."

  economy:
    title: "<gold>Money & Taxes"
    description: "The Towny day, prices, banks, taxes, upkeep, and bankruptcy."
    day: "The Towny Day"
    day-body: "Once a day Towny collects taxes and upkeep. Towns and residents that can't pay what they owe face the consequences explained in the lessons below."
    bank: "Town and Nation Banks"
    bank-body: "Towns and nations keep money in their own bank. Anyone can deposit; withdrawing needs the right rank. The bank pays for claims, upkeep, and other town costs."
    resident-tax: "Resident Taxes"
    resident-tax-body: "Mayors set a daily tax every resident pays into the town bank, either a flat amount or a percentage of their balance. A resident who can't pay may be removed from the town."
    plot-tax: "Plot Taxes"
    plot-tax-body: "Owners of taxed plots also pay a daily plot tax, with separate rates for shops and embassies. An owner who can't pay may lose the plot."
    upkeep: "Upkeep"
    upkeep-body: "Every day the town bank pays the server upkeep, which usually grows with the town's size. Nations pay upkeep from their own bank too."
    nation-tax: "Nation Taxes"
    nation-tax-body: "Nations charge each member town a daily tax from its bank. A town that can't pay may be removed from the nation."
    bankruptcy: "Debt and Bankruptcy"
    bankruptcy-body: "When bankruptcy is on, a town that can't pay its upkeep goes into debt instead of being lost. A bankrupt town can't claim land or recruit until the debt is paid. Otherwise the town falls into ruin or is deleted. Either way TownyMenu warns the mayor in chat."
    prices: "Prices and the Next Day"
    prices-body: "Prices & New Day, on the main menu, counts down to the next Towny day and lists what this server charges for founding, claiming, upkeep, plots, and taxes. Buttons that cost money also show their own price, so you can see what a claim, a teleport, or a plot takes before you click it."

  profile:
    title: "<green>Your Profile"
    description: "Your profile, other players, your plots and taxes, what you see while exploring, and spawning."
    menu: "Your Profile"
    menu-body: "Your profile shows your town, ranks, friends, plots, and balance. Write a short bio that other players see when they look at your profile."
    others: "Other Players"
    others-body: "Click any resident in a town, nation, or friends list to view their profile. From there you can add them as a friend, and mayors can invite, trust, rank, or kick them."
    display: "Borders, Titles, and the Info Tool"
    display-body: "Personal settings change what you see while exploring: a title when you cross into a town, particle borders around plots and towns, a chat map in every new chunk, and an info tool that shows who owns a block. Display Modes in your profile turns every mode off at once, or restores the server's defaults."
    spawn: "Spawning"
    spawn-body: "Go to Spawn teleports you to your town spawn, or to your bed while Bed Spawn is on. Spawning may cost money and have a cooldown, depending on the server."
    standing: "Plots, Taxes, and Standing"
    standing-body: "The bottom of your profile lists every plot you own, what you will pay in tax on the next new day, the towns that outlaw you, and the towns that trust you to build in them."
