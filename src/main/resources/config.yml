# TownyMenu Configuration

# A friendly prefix shown before plugin messages
message-prefix: "<click:run_command:/townymenu><gradient:yellow:gold>[TownyMenu]"

# Menu language. "auto" shows each player their Minecraft client language when TownyMenu has it
# (clients in an unsupported language see en_US). Set a language id such as "en_US" or "zh_CN" to use it for everyone.
# Translations live in plugins/TownyMenu/lang/ and can be edited or extended with new <id>.yml files.
language: auto

# Open the main menu when a player presses the swap-hand key (F by default) while sneaking.
# Set to false if this conflicts with another plugin's controls.
sneak-swap-hand-shortcut: true

# When a player without a town joins, suggest the tutorial (/townymenu tutorial) in chat.
# The hint stops once they have read every lesson or joined a town.
tutorial-join-hint: true

# Re-render an open menu when Towny changes what it shows, such as a resident joining, land being claimed,
# a bank transaction, or the new day. Turn this off if you would rather menus only update when they are reopened.
live-menu-refresh: true

# Announce in chat when a player is invited to a town, a town is invited to a nation, a nation is asked for an
# alliance, or a town goes bankrupt or falls into ruin. Each message opens the menu that answers it.
towny-alerts: true

# Let players see town and nation borders as particles (/townymenu borders, or Border View in the map menu).
# Each player turns it on for themselves; nearby borders are drawn in the colour of that town's relation to them.
border-view: true

# The farthest, in blocks, a player may pick for border view. Larger values draw more particles.
border-view-max-range: 16

# The preset amounts offered by the deposit and withdraw menus, in the server's currency.
# Every player also gets an "All" button and a custom-amount dialog, so this list is only a shortcut.
# Towny takes whole numbers only; up to nine amounts fit in the menu row.
bank-amounts:
  - 10
  - 100
  - 1000
  - 10000
